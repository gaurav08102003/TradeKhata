services:
  db:
    build:
      context: .
      dockerfile: DockerFile

    container_name: tradekhata_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tradekhata_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradekhata_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: